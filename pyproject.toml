[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowbench"
version = "0.1.0"
description = "Flow-Matching and Diffusion research codebase."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = [
  "flake8>=7.0",
  "pytest>=8.2.1",
  "pytest-cov>=5.0",
]
bench = [
  "Cython",
  "hmmlearn>=0.3.3",
  "imageio>=2.34",
  "pot",
  "statsmodels>=0.14",
  "torchdiffeq",
  "torchquad",
  "torchvision>=0.20",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["genkit", "labkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
