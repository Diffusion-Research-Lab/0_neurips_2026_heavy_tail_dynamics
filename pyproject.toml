[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heavy-tail-dynamics"
version = "0.1.0"
description = "Benchmarks for heavy-tailed diffusion and flow-matching dynamics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "benchtools @ git+ssh://git@github.com/Diffusion-Research-Lab/benchtools.git",
  "gendynamics @ git+ssh://git@github.com/Diffusion-Research-Lab/gendynamics.git",
  "jeanzaydata @ git+ssh://git@github.com/Diffusion-Research-Lab/jeanzaydata.git",
  "matplotlib>=3.7.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = [
  "flake8>=7.0",
  "pytest>=8.2.1",
  "pytest-cov>=5.0",
]
bench = [
  "Cython",
  "GitPython>=3.1.40",
  "einops>=0.8.1",
  "fsspec>=2023.5.0,<=2025.3.0",
  "h5py>=3.15.1",
  "herbie-data>=2024.8.0",
  "hydra-core>=1.3.2",
  "imageio>=2.34",
  "importlib-metadata>=8.7.1,<9",
  "jaxtyping>=0.3.3",
  "nvtx>=0.2.10",
  "omegaconf>=2.3.0",
  "onnx>=1.14.0",
  "packaging>=24.2",
  "requests>=2.31",
  "s3fs>=2023.5.0,<=2025.3.0",
  "statsmodels>=0.14",
  "tensordict>=0.10.0",
  "termcolor>=3.2.0",
  "timm>=1.0.22",
  "torchdiffeq",
  "torchquad",
  "treelib>=1.2.5",
  "torchvision>=0.20",
  "tqdm>=4.66",
  "warp-lang>=1.5.0",
]

[tool.setuptools]
packages = ["toolkit"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["toolkit/tests"]

[tool.coverage.run]
source = ["benchmarks", "toolkit"]
