# Minimal smoke-test config for benchmark 2.

# data
dim: 2
n_samples: 128
target_data_type: alpha_stable
l_alpha_data: {type: linspace, start: 1.2, end: 1.6, steps: 2}

# averaging
n_trials: 1
seed: 0

# generator
n_steps: 8
l_alpha_generator: {type: linspace, start: 1.2, end: 1.6, steps: 2}

# neural net
batch_size: 64
n_epochs: 1
lr: 0.001
grad_clip_norm: null
use_adamw: false
num_workers: 0

# general
device: cpu
dtype: float32
