# Fast smoke config for CIFAR100 long-tail benchmark.

data_root: ./_data
download: true
use_imagenet_weights: false

longtail_ratio: 10
head_fraction: 0.5
max_per_head: 50
max_train_samples: 1200

feature_batch_size: 128
feature_num_workers: 0

n_steps: 20
alpha: 1.5
batch_size: 128
n_epochs: 2
lr: 0.001
use_adamw: true
weight_decay: 0.0
grad_clip_norm: 1.0
lr_schedule: constant
warmup_steps: 0
freq_logging: 1
num_workers: 0

net_width: 256
net_depth: 3
net_tdim: 64
net_dropout: 0.0

n_gen_samples: 1200
minority_k: 3

seed: 0
device: auto
dtype: float32
fdtype: float32
idtype: int32
