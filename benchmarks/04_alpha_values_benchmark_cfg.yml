# data
dim: 10
n_samples: 30_000
target_data_type: alpha_stable
l_alpha_data: {type: linspace, start: 0.999, end: 1.999, steps: 4}

# averaging
n_trials: 5
seed: 0

# generator
n_steps: 150
l_alpha_generator: {type: linspace, start: 0.999, end: 1.999, steps: 4}

# neural net
batch_size: 1024
n_epochs: 150
lr: 0.001
grad_clip_norm: null
use_adamw: false
num_workers: 0

# general
device: auto
fdtype: float32
idtype: int32
