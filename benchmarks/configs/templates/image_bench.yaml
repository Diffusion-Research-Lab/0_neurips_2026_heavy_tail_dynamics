run:
  name: template_image_bench
  seed: 0
  dtype: bfloat16
  n_trial: 1

sweep:
  datasets:
    - hrrr
    - lvis
    - cifar100_lt
    - imagenet_lt
  networks:
    - transformer
  models:
    - gaussian_flow_linear
    - ddpm_v
    - dlpm_eps
    - tedm_origin
  trains:
    - standard

datasets:
  hrrr:
    kind: real
    name: hrrr
    split:
      val_size: 0.1
      test_size: 0.1
      random_state: 0
      standardize: true

  lvis:
    kind: real
    name: lvis
    params:
      split: train
      image_size: 64
      seed: 0
    split:
      val_size: 0.1
      test_size: 0.1
      random_state: 0
      standardize: false

  cifar100_lt:
    kind: real
    name: cifar100_lt
    params:
      split: train
      image_size: 32
      imbalance_factor: 10
      seed: 0
    split:
      val_size: 0.1
      test_size: 0.1
      random_state: 0
      standardize: false

  imagenet_lt:
    kind: real
    name: imagenet_lt
    params:
      split: train
      image_size: 64
      seed: 0
    split:
      val_size: 0.1
      test_size: 0.1
      random_state: 0
      standardize: false

networks:
  transformer:
    name: transformer
    params:
      n_steps: 256
      timestep_mode: continuous
      patch_size: 4
      num_layers: 12
      num_attention_heads: 6
      attention_head_dim: 64
      dropout: 0.1
      attention_bias: true
      activation_fn: gelu-approximate
      norm_type: ada_norm_single
      norm_elementwise_affine: false
      cross_attention_dim: null
      caption_channels: null
      use_additional_conditions: false

models:
  gaussian_flow_linear:
    name: gaussian_flow_linear
    params:
      n_steps: 256
      sigma_max: 2.0

  ddpm_v:
    name: ddpm_v
    params:
      n_steps: 256
      sigma_max: 2.0

  dlpm_eps:
    name: dlpm_eps
    params:
      n_steps: 256
      alpha: 1.7

  tedm_origin:
    name: tedm_origin
    params:
      n_steps: 18
      nu: 3.0
      sigma_min: 0.002
      sigma_max: 4.0

trains:
  standard:
    device: cuda
    data_device: cpu
    batch_size: 8
    n_epochs: 128
    lr: 0.0002
    pin_memory: true
    num_workers: 0
    use_adamw: true
    weight_decay: 0.0001
    grad_clip_norm: 5.0
    lr_schedule: cosine
    warmup_steps: 1000
    cosine_eta_min_ratio: 0.05
    freq_logging: 10
    ckpt_freq_epochs: 64
    ckpt_keep_last: 4

save:
  root_dir: benchmarks/artifacts
