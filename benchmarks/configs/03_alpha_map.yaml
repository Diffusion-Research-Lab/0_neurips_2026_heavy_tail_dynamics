run:
  name: alpha_map
  seed: 0
  dtype: float32

sweep:
  datasets:
    - alpha_stable_target
  networks:
    - mlp_heavy_flow
  models:
    - native_dlpm
  trains:
    - heavy_flow_train

datasets:
  alpha_stable_target:
    kind: synthetic
    name: alpha_stable
    params:
      n_samples: 50000
      alpha: [1.5, 1.625, 1.75, 1.875, 2.0]
      dim: [5]
    split:
      val_size: 0.3
      test_size: 0.3
      random_state: 0
      standardize: false

networks:
  mlp_heavy_flow:
    name: mlp
    params:
      width: 32
      depth: 3
      time_dim: 8
      dropout: 0.0
      use_norm: true

models:
  native_dlpm:
    name: dlpm_eps
    params:
      n_steps: 128
      alpha: [1.5, 1.625, 1.75, 1.875, 2.0]

trains:
  heavy_flow_train:
    device: cpu
    batch_size: 1024
    n_epochs: 2048
    lr: 0.001
    num_workers: 0
    use_adamw: false
    weight_decay: 0.0
    grad_clip_norm: 10.0
    lr_schedule: cosine
    warmup_steps: 0
    freq_logging: 10
    ckpt_freq_epochs: 10
    ckpt_keep_last: 3

save:
  root_dir: _results
