run:
  name: benchmark
  seed: 0
  dtype: float32
  n_trial: 3

sweep:
  datasets:
    - alpha_stable_target
  networks:
    - mlp
  models:
    - gaussian_flow_linear
    - ddpm_v
    - dlpm_eps
    - dlpm_eps_origin
    - flow_matching_origin
  trains:
    - standard

datasets:
  alpha_stable_target:
    kind: synthetic
    name: alpha_stable
    params:
      n_samples: 100000
      alpha: [1.5, 1.7, 2.0]
      dim: [20]
    split:
      val_size: 0.15
      test_size: 0.15
      random_state: 0
      standardize: false

  mlp:
    name: mlp
    params:
      width: 128
      depth: 4
      time_dim: 64
      dropout: 0.0
      use_norm: true

models:

  gaussian_flow_linear:
    name: gaussian_flow_linear
    params:
      n_steps: 128

  ddpm_v:
    name: ddpm_v
    params:
      n_steps: 128

  dlpm_eps:
    name: dlpm_eps
    params:
      n_steps: 128
      alpha: [1.5, 1.7, 2.0]

  dlpm_eps_origin:
    name: dlpm_eps_origin
    params:
      n_steps: 128
      alpha: [1.5, 1.7, 2.0]

  flow_matching_origin:
    name: flow_matching_origin
    params:
      n_steps: 128

trains:
  standard:
    device: cuda
    batch_size: 1024
    n_epochs: 512
    lr: 0.005
    num_workers: 0
    use_adamw: false
    weight_decay: 0.0
    grad_clip_norm: 10.0
    lr_schedule: cosine
    warmup_steps: 0
    freq_logging: 50
    ckpt_freq_epochs: 16
    ckpt_keep_last: 2

save:
  root_dir: _results
