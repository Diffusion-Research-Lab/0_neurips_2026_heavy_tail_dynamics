run:
  name: pilot_image
  seed: 0
  dtype: float32
  n_trial: 3

sweep:
  datasets:
    - hrrr
    - lvis
    - cifar100_lt
    - imagenet_lt
  networks:
    - unet
  models:
    - gaussian_flow_ot_s1
    - gaussian_flow_ot_s2
    - gaussian_flow_linear_s1
    - gaussian_flow_linear_s2
    - ddpm_v_s1
    - ddpm_v_s2
    - dlpm_eps_a17
    - dlpm_eps_a19
    - tedm_origin_nu25
    - tedm_origin_nu30
  trains:
    - pilot_lr1e4
    - pilot_lr2e4

datasets:
  hrrr:
    kind: real
    name: hrrr
    params:
      n_samples: 4096
    split:
      val_size: 0.1
      test_size: 0.1
      random_state: 0
      standardize: true

  lvis:
    kind: real
    name: lvis
    params:
      split: train
      image_size: 64
      max_samples: 4096
      seed: 0
    split:
      val_size: 0.1
      test_size: 0.1
      random_state: 0
      standardize: false

  cifar100_lt:
    kind: real
    name: cifar100_lt
    params:
      split: train
      image_size: 64
      imbalance_factor: 20
      max_samples: 4096
      seed: 0
    split:
      val_size: 0.1
      test_size: 0.1
      random_state: 0
      standardize: false

  imagenet_lt:
    kind: real
    name: imagenet_lt
    params:
      split: train
      image_size: 64
      max_samples: 4096
      seed: 0
    split:
      val_size: 0.1
      test_size: 0.1
      random_state: 0
      standardize: false

networks:
  unet:
    name: unet
    params:
      model_channels: 32
      num_res_blocks: 1
      attention_resolutions:
        literal: [4]
      dropout: 0.1
      channel_mult:
        literal: [1, 2, 2]
      conv_resample: true
      dims: 2
      num_heads: 4
      use_scale_shift_norm: true

models:
  gaussian_flow_ot_s1:
    name: gaussian_flow_ot
    params:
      n_steps: 128
      sigma_min: 0.001
      sigma_max: 1.0

  gaussian_flow_ot_s2:
    name: gaussian_flow_ot
    params:
      n_steps: 128
      sigma_min: 0.001
      sigma_max: 2.0

  gaussian_flow_linear_s1:
    name: gaussian_flow_linear
    params:
      n_steps: 128
      sigma_max: 1.0

  gaussian_flow_linear_s2:
    name: gaussian_flow_linear
    params:
      n_steps: 128
      sigma_max: 2.0

  ddpm_v_s1:
    name: ddpm_v
    params:
      n_steps: 128
      sigma_max: 1.0

  ddpm_v_s2:
    name: ddpm_v
    params:
      n_steps: 128
      sigma_max: 2.0

  dlpm_eps_a17:
    name: dlpm_eps
    params:
      n_steps: 128
      alpha: 1.7

  dlpm_eps_a19:
    name: dlpm_eps
    params:
      n_steps: 128
      alpha: 1.9

  tedm_origin_nu25:
    name: tedm_origin
    params:
      n_steps: 12
      nu: 2.5
      sigma_min: 0.002
      sigma_max: 4.0

  tedm_origin_nu30:
    name: tedm_origin
    params:
      n_steps: 12
      nu: 3.0
      sigma_min: 0.002
      sigma_max: 4.0

trains:
  pilot_lr1e4:
    device: cuda
    batch_size: 8
    n_epochs: 16
    lr: 0.0001
    num_workers: 0
    use_adamw: true
    weight_decay: 0.0001
    grad_clip_norm: 5.0
    lr_schedule: cosine
    warmup_steps: 10
    cosine_eta_min_ratio: 0.05
    freq_logging: 1
    ckpt_freq_epochs: 1
    ckpt_keep_last: 1

  pilot_lr2e4:
    device: cuda
    batch_size: 8
    n_epochs: 16
    lr: 0.0002
    num_workers: 0
    use_adamw: true
    weight_decay: 0.0001
    grad_clip_norm: 5.0
    lr_schedule: cosine
    warmup_steps: 10
    cosine_eta_min_ratio: 0.05
    freq_logging: 1
    ckpt_freq_epochs: 1
    ckpt_keep_last: 1

save:
  root_dir: benchmarks/artifacts
