# Shariatan et al DLPM path
authors_root:
  mode: home_subpath
  subpath: ["src", "DLPM"]
  env_var: DLPM_AUTHORS_ROOT

# data
dim: 10
n_samples: 10000
target_data_type: alpha_stable
l_alpha_data: {type: linspace, start: 0.999, end: 1.999, steps: 5}

# averaging
n_trials: 5
seed: 0

# generator
n_steps: 100
l_alpha_generator: {type: linspace, start: 0.999, end: 1.999, steps: 5}

# neural net
batch_size: 512
n_epochs: 150
lr: 0.001
grad_clip_norm: null
use_adamw: false
num_workers: 0

# general
device: auto
dtype: float64
