run:
  name: 03_modecollapsing_effect
  seed: 0
  dtype: float32
  n_trial: 3

sweep:
  datasets:
    - unbalanced_highdim_gaussian_mixture_target
  networks:
    - mlp
  models:
    - gaussian_flow_linear
    - ddpm_v
    - dlpm_eps
    - flow_matching_origin
  trains:
    - standard

datasets:
  unbalanced_highdim_gaussian_mixture_target:
    kind: synthetic
    name: unbalanced_highdim_gaussian_mixture
    params:
      n_samples: 100000
      dim: 50
      n_modes: 16
      rank: 6
      imbalance_tau: 1.2
      mean_scale: 7.5
      base_std: 0.55
      anisotropy: 1.0
      structure_seed: 0
    split:
      val_size: 0.1
      test_size: 0.1
      random_state: 0
      standardize: false

networks:
  mlp:
    name: mlp
    params:
      width: 256
      depth: 5
      time_dim: 128
      dropout: 0.05
      use_norm: true

models:
  gaussian_flow_linear:
    name: gaussian_flow_linear
    params:
      n_steps: 128

  ddpm_v:
    name: ddpm_v
    params:
      n_steps: 128

  dlpm_eps:
    name: dlpm_eps
    params:
      n_steps: 128
      alpha: [1.3, 1.5, 1.7]

  flow_matching_origin:
    name: flow_matching_origin
    params:
      n_steps: 128

trains:
  standard:
    device: cuda
    batch_size: 1024
    n_epochs: 1024
    lr: 0.005
    num_workers: 0
    use_adamw: false
    weight_decay: 0.0
    grad_clip_norm: 10.0
    lr_schedule: cosine
    warmup_steps: 0
    freq_logging: 50
    ckpt_freq_epochs: 128
    ckpt_keep_last: 8

save:
  root_dir: _03_results
